basePath: /v1
definitions:
  dto.CoinDTO:
    properties:
      rate:
        type: number
      title:
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API for retrieving cryptocurrency exchange rates and statistics on
    average, minimum, and maximum values.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: MyProject Crypto API
  version: "1.0"
paths:
  /coins/get_actual/{titles}:
    get:
      consumes:
      - application/json
      description: Returns the latest actual rates for the specified currencies
      parameters:
      - description: List of currencies separated by commas (e.g., BTC,ETH,USD)
        in: path
        name: titles
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with actual rates
          schema:
            items:
              $ref: '#/definitions/dto.CoinDTO'
            type: array
        "400":
          description: Invalid request (missing titles parameter)
          schema:
            type: string
        "404":
          description: No coins found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Fetch actual currency rates
      tags:
      - coins
securityDefinitions:
  BasicAuth:
    type: basic
swagger: "2.0"
