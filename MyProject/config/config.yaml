  server:
    port: 8080

  database:
    url: "postgres://postgres:postgres@localhost:5432/myproject?sslmode=disable"
    max_connections: 10
    min_connections: 2

  external_api:
    coindesk:
      base_url: "https://min-api.cryptocompare.com"
      timeout: 10s
      currency: "USD"

  update_interval: 5m

  log:
    level: "info"                 # Уровень логирования
    format: "text"                # Формат логов